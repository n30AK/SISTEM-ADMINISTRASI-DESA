async function authSignup(){const msg=document.getElementById('authMsg');const e=(email.value||'').trim();const p=password.value||'';if(!e||!p){msg.textContent='Email dan kata sandi wajib diisi.';return}msg.textContent='Mendaftarkan akun…';const {data,error}=await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}});if(error){msg.textContent=error.message;return}if(data?.user?.identities?.length===0){msg.textContent='Akun dengan email ini sudah terdaftar. Gunakan Masuk, Kirim Ulang Konfirmasi, atau reset kata sandi.';return}if(data?.session){msg.textContent='Akun dibuat dan sesi aktif. Memuat sistem…';location.reload();return}msg.textContent='Akun dibuat. Periksa Kotak Masuk dan Spam untuk konfirmasi email. Jika email tidak masuk, gunakan Kirim Ulang Konfirmasi.'}

document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};document.getElementById('refresh').onclick=()=>render();render();
</script></body></html>
